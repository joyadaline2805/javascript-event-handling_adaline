<!DOCTYPE>
<html><style>

    .highlight-border{
        border:5px solid green;
        border-radius: 8px;
    }
</style>
   

    <body>
        <h1> image boder</h1>
        <img id="photo" src="cute pic.jpg" height="200" width="100" alt="image  pic">
        <br>
        <br>
        <button id="BorderBtn">Togger Border</button>
        <script>
            const btn=document.getElementById("BorderBtn");
            const img=document.getElementById("photo");
            btn.addEventListener('click',function(){
                img.classList.toggle("highlight-border");
            });
            
            </script>
    </body>
    </html>

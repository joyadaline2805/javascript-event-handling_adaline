<!DOCTYPE>
<html>
    <body>
        <h1>Form</h1>
        <form onsubmit="return validateForm()">
        <label for="name">Name:</label>
        <input type="text" id="name" name="name">
        <br>
        <br>
        <label for="email">Email id:</label>
        <input type="email" id="email" name="email">
        <br>
            <br>
            <label for="mobile">Phone No:</label>
            <input type="tel" id="mobile" name="phone">
            <br>
            <br>
            <button type="submit"> submit</button>
        </form>
        <script>
            function validateName(name){
                if(name==null||name.trim()==""){
                    alert("name must be blank");
                    return false;
                }
                
            
            if(name.length<3){
                alert("Name must be atleast 3 characters long!!");
                return false;
            }
            return true;
        
        }
        
        function validateForm(){
            var name=document.getElementById("name").value.trim();
            var mobile= document.getElementById("mobile").value.trim();
            var email=document.getElementById("email").value.trim();
            if (!validateName(name)){
                return false;
            }
            
            if(mobile.length!=10){
                alert("Mobile number must contain 10 digits!!")
                return false;
            }
            for(var i=0;i< mobile.length;i++){
                if(mobile[i]<'0'||mobile[i]>'9'){
                    alert("Mobile number must contain digits only!!");
                    return false;
                }
         
           }
           if(email==null||email==""){
            alert("Email Id can't be blank");
            return false;

           }
           var atIndex=email.indexOf("@");
           var dotIndex=email.lastIndexOf(".");
           if(atIndex<3||dotIndex<atIndex+2||dotIndex==email.length-1){
           alert("please enter valid email id");
        return false;

        }
        alert("Form submitted sucessfully");
        return true;
    }
        </script>
    </body>
    </html>
